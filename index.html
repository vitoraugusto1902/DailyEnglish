<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b3a"><title>Daily English C1</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eff2;color:#172b39;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:700px;margin:auto;padding:14px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 2px 15px #12233312}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;font-weight:800;letter-spacing:1.3px;color:#4a6c7c}.pill{background:#e8f3ed;border-radius:30px;padding:7px 10px;color:#246b4b}h1{font-size:clamp(20px,5vw,29px);line-height:1.17;margin:18px 0 12px}.kind{font-size:12px;color:#587485;font-weight:700;text-transform:uppercase}p{font-size:15px;line-height:1.65}h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;border-top:1px solid #e5e9ec;padding-top:17px;margin-top:19px}.word{margin:10px 0;font-size:14px}.word b{color:#174f68}.controls{display:flex;gap:8px;margin-top:22px}button{flex:1;border:0;border-radius:10px;padding:12px;background:#173e52;color:white;font-weight:700}button:disabled{opacity:.3}.foot{font-size:11px;color:#68818d;margin-top:14px;text-align:center}@media(max-width:420px){.wrap{padding:5px}.card{padding:15px;border-radius:12px}p{font-size:14px;line-height:1.52}h1{margin:12px 0;font-size:21px}}</style></head><body><main class="wrap"><article class="card"><div class="top"><span>DAILY ENGLISH · C1</span><span class="pill" id="day"></span></div><div class="kind" id="kind"></div><h1 id="title"></h1><div id="reading"></div><h2>Vocabulary of the day</h2><div id="vocab"></div><div class="controls"><button id="prev">← Previous</button><button id="today">Today</button><button id="next">Next →</button></div><div class="foot">Original practice readings · Not official Cambridge material</div></article></main><script>
const base=new Date(2026,9,27);const items=[
{kind:'Article',title:'The hidden cost of convenience',text:'Modern technology promises to make everyday life effortless. From navigation apps to automated recommendations, we increasingly delegate small decisions to digital systems. Although this undoubtedly saves time, the long-term consequences deserve closer scrutiny. When convenience becomes our default expectation, even minor inconveniences can feel disproportionately frustrating. Furthermore, relying on algorithms to select what we read or watch may gradually narrow our exposure to unfamiliar perspectives. None of this suggests that technological progress should be rejected. Rather, we ought to distinguish between tools that genuinely enhance our capabilities and those that quietly replace skills we still value. A sensible approach would involve using technology deliberately: turning off unnecessary notifications, occasionally navigating without directions, and choosing challenging material instead of accepting whatever appears first. Ultimately, convenience is most beneficial when it gives us greater freedom, rather than making us increasingly dependent.',v:[['deserve closer scrutiny','merecer análise mais cuidadosa'],['delegate','delegar'],['narrow our exposure','reduzir nosso contato com']]},
{kind:'Review',title:'A museum that makes science feel alive',text:'Having visited several conventional science exhibitions, I approached the new interactive museum with fairly modest expectations. Yet it proved to be a remarkably engaging experience. Rather than overwhelming visitors with lengthy explanations, the exhibition encourages them to test hypotheses, question assumptions and draw their own conclusions. One particularly memorable installation explores how easily human perception can be deceived. Its greatest strength is the balance between entertainment and intellectual substance: the activities are enjoyable without becoming superficial. Admittedly, the queues for the most popular experiments can be frustrating, and some exhibits would benefit from clearer instructions. Nevertheless, these are relatively minor shortcomings in an otherwise impressive venue. I would wholeheartedly recommend it to curious teenagers and adults alike, especially those who mistakenly believe science is too complicated to be enjoyable.',v:[['modest expectations','expectativas modestas'],['shortcomings','pontos fracos'],['wholeheartedly','sem reservas']]},
{kind:'Proposal',title:'Encouraging students to read more widely',text:'The aim of this proposal is to outline practical measures that could encourage students to read beyond their compulsory course materials. At present, many learners associate reading primarily with examinations, which may undermine their motivation to explore unfamiliar subjects. First, the institution could establish a weekly reading exchange, allowing students to recommend short articles, essays and reviews to their peers. Such an initiative would expose participants to a broader range of writing styles without imposing an excessive workload. Second, a digital reading board could feature one carefully selected text each day, accompanied by a brief vocabulary guide. This would make independent reading more accessible and easier to incorporate into a busy schedule. I therefore recommend piloting both initiatives for six weeks and collecting feedback before deciding whether to introduce them permanently.',v:[['outline practical measures','apresentar medidas práticas'],['undermine','prejudicar gradualmente'],['piloting','testar em pequena escala']]},
{kind:'Report',title:'Students’ study habits: findings and recommendations',text:'This report summarises the findings of an informal survey concerning students’ independent study habits. The responses suggest that most participants recognise the value of regular revision, yet relatively few follow a consistent timetable. A recurring obstacle is the tendency to underestimate how much time small distractions consume. Several respondents also reported that lengthy study sessions left them feeling exhausted rather than productive. On the positive side, students who divided their work into shorter, clearly defined tasks appeared more satisfied with their progress. These findings should be interpreted cautiously, as the sample was limited and self-reported. Nevertheless, they indicate that effective study strategies may depend more on consistency than on the total number of hours spent studying. It is recommended that students experiment with manageable daily goals and review their progress weekly.',v:[['recurring obstacle','obstáculo recorrente'],['self-reported','relatado pelos próprios participantes'],['manageable','viável, administrável']]},
{kind:'Essay',title:'Should universities prioritise employability?',text:'Whether universities should focus primarily on preparing students for employment remains a contentious issue. On the one hand, higher education often involves substantial financial commitments, and graduates understandably expect their qualifications to improve their career prospects. Universities therefore have a responsibility to ensure that their courses develop relevant, transferable skills. On the other hand, reducing education to vocational training risks overlooking its broader social and intellectual value. Subjects that do not lead directly to a specific profession can still foster critical thinking, creativity and informed citizenship. Moreover, the labour market changes so rapidly that narrowly specialised knowledge may become outdated. In my view, universities should pursue a balanced approach, combining practical experience with opportunities for independent inquiry. Their purpose should not merely be to help students secure their first job, but to equip them for a lifetime of learning.',v:[['contentious issue','questão controversa'],['transferable skills','habilidades transferíveis'],['independent inquiry','investigação autônoma']]},
{kind:'Article',title:'Why boredom might be useful',text:'Boredom is generally regarded as an unpleasant state to be avoided whenever possible. As a result, many people instinctively reach for their phones during even the briefest moments of inactivity. However, constantly filling these gaps may deprive us of opportunities for reflection. When the mind is not occupied by an immediate task, it can wander between ideas, revisit unresolved questions and make unexpected connections. This does not mean that boredom automatically produces creativity; prolonged inactivity can be genuinely distressing. Nevertheless, a little unstructured time may be valuable in a culture that places enormous emphasis on productivity. Rather than treating every spare minute as a problem to solve, we might occasionally allow ourselves to do nothing at all. Such moments can provide the mental space needed to reconsider priorities and develop fresh perspectives.',v:[['deprive us of','nos privar de'],['unresolved questions','questões não resolvidas'],['unstructured time','tempo sem programação']]},
{kind:'Review',title:'An unexpectedly thought-provoking documentary',text:'At first glance, this documentary appears to be a straightforward account of how cities have expanded over the past century. In fact, it offers a far more compelling examination of the choices that shape urban life. Through interviews with residents, planners and researchers, the film reveals how seemingly minor design decisions can influence social interaction and wellbeing. The narrative is particularly effective when contrasting lively pedestrian areas with neighbourhoods dominated by traffic. Although a few sections are unnecessarily repetitive, the documentary remains accessible without oversimplifying a complex subject. The cinematography is striking, but it never distracts from the central argument. What makes the film worth watching is its refusal to offer easy answers. Instead, viewers are encouraged to consider whose needs are prioritised when cities are designed.',v:[['at first glance','à primeira vista'],['compelling','envolvente, convincente'],['oversimplifying','simplificar excessivamente']]}
];
let offset=0;const elapsed=()=>Math.max(0,Math.floor((new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())-base)/86400000));function draw(){const index=Math.max(0,elapsed()+offset),i=items[index%items.length];document.getElementById('day').textContent='DAY '+(index+1);document.getElementById('kind').textContent=i.kind;document.getElementById('title').textContent=i.title;document.getElementById('reading').innerHTML='<p>'+i.text+'</p>';document.getElementById('vocab').innerHTML=i.v.map(([a,b])=>'<div class="word"><b>'+a+'</b> — '+b+'</div>').join('');document.getElementById('prev').disabled=index===0;document.getElementById('today').disabled=offset===0;}document.getElementById('prev').onclick=()=>{offset--;draw()};document.getElementById('next').onclick=()=>{offset++;draw()};document.getElementById('today').onclick=()=>{offset=0;draw()};draw();document.addEventListener('visibilitychange',()=>{if(!document.hidden){offset=0;draw()}});
</script></body></html>
